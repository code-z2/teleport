# Generate the Xcode project with:  cd ios && xcodegen
# Configure first: cp Config/Teleport.xcconfig.example Config/Teleport.xcconfig

name: Teleport
options:
  deploymentTarget: { iOS: "18.0" }
  createIntermediateGroups: true
configFiles:
  Debug: Config/Teleport.xcconfig
  Release: Config/Teleport.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: $(TELEPORT_TEAM_ID)
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    TARGETED_DEVICE_FAMILY: "1"

packages:
  TeleportCore: { path: Packages/TeleportCore }
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 12.0.0

# Every target reads the same keys from its Info.plist (see TeleportConfig.fromBundle).
x-teleport-info: &teleportInfo
  TeleportRelayURL: $(TELEPORT_RELAY_URL)
  TeleportRelayKey: $(TELEPORT_RELAY_KEY)
  TeleportAppGroup: group.$(TELEPORT_BUNDLE_ID)
  TeleportKeychainGroup: $(AppIdentifierPrefix)$(TELEPORT_BUNDLE_ID).shared
  CFBundleDisplayName: Teleport

x-shared-entitlements: &sharedEntitlements
  com.apple.security.application-groups: [group.$(TELEPORT_BUNDLE_ID)]
  keychain-access-groups: [$(AppIdentifierPrefix)$(TELEPORT_BUNDLE_ID).shared]

targets:
  Teleport:
    type: application
    platform: iOS
    sources: [Teleport, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TELEPORT_BUNDLE_ID)
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # Teleport/AppIcon.icon — edit it in Icon Composer (Xcode → Open Developer Tool).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: TeleportCore
      - package: Firebase
        product: FirebaseMessaging
      - target: TeleportShare
      - target: TeleportNotificationService
      - target: TeleportLiveActivity
    info:
      path: Teleport/Info.plist
      properties:
        <<: *teleportInfo
        UILaunchScreen: {}
        NSCameraUsageDescription: Scan the pairing code shown on your other phone.
        NSSupportsLiveActivities: true
        UIBackgroundModes: [remote-notification]
        FirebaseAppDelegateProxyEnabled: true
    entitlements:
      path: Teleport/Teleport.entitlements
      properties:
        <<: *sharedEntitlements
        aps-environment: development

  TeleportShare:
    type: app-extension
    platform: iOS
    sources: [ShareExtension]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TELEPORT_BUNDLE_ID).share
    dependencies:
      - package: TeleportCore
    info:
      path: ShareExtension/Info.plist
      properties:
        <<: *teleportInfo
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 1
    entitlements:
      path: ShareExtension/TeleportShare.entitlements
      properties: *sharedEntitlements

  TeleportNotificationService:
    type: app-extension
    platform: iOS
    sources: [NotificationService]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TELEPORT_BUNDLE_ID).nse
    dependencies:
      - package: TeleportCore
    info:
      path: NotificationService/Info.plist
      properties:
        <<: *teleportInfo
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    entitlements:
      path: NotificationService/TeleportNotificationService.entitlements
      properties: *sharedEntitlements

  TeleportLiveActivity:
    type: app-extension
    platform: iOS
    sources: [LiveActivity, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TELEPORT_BUNDLE_ID).liveactivity
    dependencies:
      - package: TeleportCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: LiveActivity/Info.plist
      properties:
        <<: *teleportInfo
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: LiveActivity/TeleportLiveActivity.entitlements
      properties: *sharedEntitlements
